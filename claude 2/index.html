<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <h1 class="glitch-text" data-text="TETRIS">TETRIS</h1>
            <div class="menu-buttons">
                <button id="btn-play"><span class="glitch-text" data-text="PLAY">PLAY</span></button>
                <button id="btn-settings"><span class="glitch-text" data-text="SETTINGS">SETTINGS</span></button>
                <button id="btn-scoreboard"><span class="glitch-text" data-text="SCOREBOARD">SCOREBOARD</span></button>
            </div>
            <div class="right-panels">
                <div id="main-music-player" class="panel-box music-player-box">
                    <h3>Music</h3>
                    <div class="now-playing-container">
                        <div class="now-playing-title marquee">No Song</div>
                    </div>
                    <div class="player-controls">
                        <button class="btn-player-mode" title="Loop All">[ALL]</button>
                        <button class="btn-player-prev">&lt;&lt;</button>
                        <button class="btn-player-playpause">PLAY</button>
                        <button class="btn-player-next">&gt;&gt;</button>
                    </div>
                </div>
                <div id="main-leaderboard" class="panel-box main-leaderboard">
                    <h3>Leaderboard</h3>
                    <div class="panel-scroll">
                        <ul id="main-leaderboard-list">
                            <!-- Injected via JS -->
                        </ul>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- Settings Menu -->
        <div id="settings-menu" class="screen">
            <h2 class="glitch-text" data-text="Settings">Settings</h2>
            <div class="settings-content">
                <div class="settings-scroll">
                    <div class="keybind-group theme-group">
                        <label>Theme</label>
                        <div class="theme-selector" id="theme-selector">
                            <button class="theme-btn" data-theme-value="modern">Modern</button>
                            <button class="theme-btn" data-theme-value="cyberpunk">Cyberpunk</button>
                            <button class="theme-btn" data-theme-value="nes">NES</button>
                            <button class="theme-btn" data-theme-value="nebula">Nebula</button>
                        </div>
                    </div>
                    <div class="keybind-group sfx-volume-group">
                        <label>SFX Volume</label>
                        <div style="display: flex; align-items: center;">
                            <input type="range" id="slider-sfx-volume" min="0" max="100" value="80" class="volume-slider">
                            <span id="sfx-volume-val" style="margin-left: 10px; font-weight: bold; width: 45px;">80%</span>
                        </div>
                    </div>
                    <div class="keybind-group music-volume-group">
                        <label>Music Volume</label>
                        <div style="display: flex; align-items: center;">
                            <input type="range" id="slider-music-volume" min="0" max="100" value="80" class="volume-slider">
                            <span id="music-volume-val" style="margin-left: 10px; font-weight: bold; width: 45px;">80%</span>
                        </div>
                    </div>
                    <div class="keybind-group music-group">
                        <label>Music Playlist</label>
                        <input type="file" id="file-add-song" multiple accept="audio/*" style="display:none">
                        <button id="btn-add-song" class="action-btn" style="background:var(--accent-color); color:var(--bg-color);">Add Songs</button>
                    </div>
                    <ul id="playlist-container" class="playlist-list">
                        <!-- Playlist items go here -->
                    </ul>
                    <div class="keybind-group">
                        <label>Move Left</label>
                        <button class="keybind-btn" data-action="left">ArrowLeft</button>
                    </div>
                    <div class="keybind-group">
                        <label>Move Right</label>
                        <button class="keybind-btn" data-action="right">ArrowRight</button>
                    </div>
                    <div class="keybind-group">
                        <label>Soft Drop</label>
                        <button class="keybind-btn" data-action="softDrop">ArrowDown</button>
                    </div>
                    <div class="keybind-group">
                        <label>Hard Drop</label>
                        <button class="keybind-btn" data-action="hardDrop">Space</button>
                    </div>
                    <div class="keybind-group">
                        <label>Rotate CW</label>
                        <button class="keybind-btn" data-action="rotateCW">ArrowUp</button>
                    </div>
                    <div class="keybind-group">
                        <label>Rotate CCW</label>
                        <button class="keybind-btn" data-action="rotateCCW">KeyZ</button>
                    </div>
                    <div class="keybind-group">
                        <label>Hold Piece</label>
                        <button class="keybind-btn" data-action="hold">KeyC</button>
                    </div>
                    <div class="keybind-group">
                        <label>Music: Play/Pause</label>
                        <button class="keybind-btn" data-action="musicPlayPause">KeyP</button>
                    </div>
                    <div class="keybind-group">
                        <label>Music: Mode</label>
                        <button class="keybind-btn" data-action="musicMode">KeyM</button>
                    </div>
                    <div class="keybind-group">
                        <label>Music: Prev</label>
                        <button class="keybind-btn" data-action="musicPrev">Comma</button>
                    </div>
                    <div class="keybind-group">
                        <label>Music: Next</label>
                        <button class="keybind-btn" data-action="musicNext">Period</button>
                    </div>
                </div>
            </div>
            <button id="btn-settings-back" class="back-btn">Back</button>
        </div>

        <!-- Scoreboard -->
        <div id="scoreboard-menu" class="screen">
            <h2 class="glitch-text" data-text="High Scores">High Scores</h2>
            <div class="scoreboard-content">
                <div class="panel-scroll">
                    <table id="scores-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Score</th>
                                <th>Lines</th>
                                <th>Level</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Scores injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <button id="btn-scoreboard-back" class="back-btn">Back</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <div class="side-panel left">
                    <div class="panel-box hold-box">
                        <h3>Hold</h3>
                        <canvas id="hold-canvas" width="100" height="100"></canvas>
                    </div>
                    <div class="panel-box music-player-box">
                        <h3>Music</h3>
                        <div class="now-playing-container">
                            <div class="now-playing-title marquee">No Song</div>
                        </div>
                        <div class="player-controls">
                            <button class="btn-player-mode" title="Loop All">[ALL]</button>
                            <button class="btn-player-prev">&lt;&lt;</button>
                            <button class="btn-player-playpause">PLAY</button>
                            <button class="btn-player-next">&gt;&gt;</button>
                        </div>
                    </div>
                    <div class="stats-box">
                        <div class="stat">
                            <span>Score</span>
                            <span id="score-display">0</span>
                        </div>
                        <div class="stat">
                            <span>Level</span>
                            <span id="level-display">1</span>
                        </div>
                        <div class="stat">
                            <span>Lines</span>
                            <span id="lines-display">0</span>
                        </div>
                    </div>
                </div>

                <div class="board-container">
                    <canvas id="game-canvas" width="360" height="720"></canvas>
                    <div id="action-text-container"></div>
                </div>

                <div class="side-panel right">
                    <div class="panel-box next-box">
                        <h3>Next</h3>
                        <canvas id="next-canvas" width="120" height="360"></canvas>
                        <div class="controls-hint" style="text-align: center; margin-top: 1rem; color: var(--text-color); font-size: 0.8rem; opacity: 0.7;">
                            Press [ESC] to Pause
                        </div>
                    </div>
                </div>
            </div>

            <!-- Overlays -->
            <div id="pause-overlay" class="game-overlay hidden">
                <h2 class="glitch-text" data-text="PAUSED">PAUSED</h2>
                <div class="menu-buttons">
                    <button id="btn-resume">Resume</button>
                    <button id="btn-pause-settings">Settings</button>
                    <button id="btn-quit">Quit to Menu</button>
                </div>
            </div>
            <div id="game-over-overlay" class="game-overlay hidden">
                <h2 class="glitch-text" data-text="GAME OVER">GAME OVER</h2>
                <div class="final-score">Score: <span id="final-score-val">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" placeholder="ENTER NAME" maxlength="10">
                    <button id="btn-save-score">Save</button>
                </div>
                <div id="game-over-buttons" class="hidden">
                    <button id="btn-restart">Play Again</button>
                    <button id="btn-menu">Main Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/background.js"></script>
    <script src="js/input.js"></script>
    <script src="js/tetromino.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
